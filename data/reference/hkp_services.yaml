# HKP (SGB V §37) positions used in the demo (DAT-04 / REF-04).
# ILLUSTRATIVE. Positionsnummern follow the 6-digit pattern of the GKV
# Positionsnummernverzeichnis HKP (18.05.2026): digits 1–2 legal basis (03 = §37(2) S.1),
# digit 3 care type (1 Grund-, 2 Behandlungspflege, 3 Hauswirtschaft), digits 4–6 the
# service. The service digits and EVERY PRICE are invented: Bavarian §132a prices
# are not public (docs/03 §3.2). Prices are integer cents per unit.
#
# category: matches extraction MeasureCategory, so a Verordnung measure covers the
#   positions of its category unless it names a position_no.
# ancillary: billed alongside a visit (Wegepauschale); needs a valid Verordnung on the
#   day but is not itself prescribed, approved or frequency-checked.
synthetic: true
illustrative: true
source: "https://www.gkv-datenaustausch.de/media/dokumente/leistungserbringer_1/sonstige_leistungserbringer/positionsnummernverzeichnisse/Haeusliche-Krankenpflege_20260518.pdf"
