[project]
name = "kassenfest"
version = "0.1.0"
description = "Checks home-care bills (HKP / SGB XI) against the rules before they go to the Kasse."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "holidays>=0.107",
    "httpx>=0.28.1",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.5.4",
    "openai>=3.40.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
kassenfest = "kassenfest.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# German documents and prompts legitimately contain en dashes and umlauts.
ignore = ["RUF001", "RUF002", "RUF003"]
